version: 2

build:
  os: "ubuntu-24.04"
  tools:
    python: "3.11"
  jobs:
    create_environment:
      - asdf plugin add pixi
      - asdf install pixi latest
      - asdf global pixi latest
    install:
      # assuming you have an environment called "docs"
      - pixi install -e docs
      - pixi run pip install .
    build:
      html:
        - pixi run -e docs sphinx-build -b html docs docs/_build/html

  - conda-forge
  # required by mr_reduction
  - mantid-ornl
  - mantid
dependencies:
  - mr_reduction=2.5.0
  - anaconda-client
  - boa
  - codecov
  - conda-build
  - conda-verify
  - libarchive
  - libmamba
  - pre-commit
  - pylint

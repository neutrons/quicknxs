name: Tests, Package, and Deployment

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [next, qa, main]
    tags: ["v*"]

# cancel previous job if new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PKG_NAME: quicknxs

jobs:
  #################
  ### Run Tests ###
  #################

  tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.6

      - name: Generate cache key for submodule
        id: generate-cache-key
        run: |
          # Get the submodule commit SHA
          SUBMODULE_SHA=$(git submodule status | awk '{print $1}' | sha256sum | cut -d ' ' -f 1)
          echo "SUBMODULE_KEY=$SUBMODULE_SHA" >> $GITHUB_ENV

      - name: Restore/save LFS files in cache
        id: cache-lfs
        uses: actions/cache@v5
        with:
          path: tests/data/quicknxs-data/
          key: submodule-${{ env.SUBMODULE_KEY }}

      - name: Configure Git credentials for code.ornl.gov
        if: steps.cache-lfs.outputs.cache-hit != 'true'
        env:
          TOKEN: ${{ secrets.DATA_READ_TOKEN }}
        run: |
          git config --global url."https://gitlab-ci-token:${TOKEN}@code.ornl.gov/".insteadOf "https://code.ornl.gov/"

      - name: Pull LFS files for the submodule
        if: steps.cache-lfs.outputs.cache-hit != 'true'
        run: |
          git submodule update --init
          git lfs pull

      - name: Unit test with code coverage
        run: pixi run test -vv --cov=src --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }} # required

  ##############################
  ### Package and Deployment ###
  ##############################

  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read          # for actions/checkout
      security-events: write  # for github/codeql-action/upload-sarif to upload Grype results
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 100
          fetch-tags: true
          ref: ${{ github.ref }}

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.6

      - name: Build conda package
        run: |
          pixi run conda-build
          mkdir -p /tmp/local-channel/noarch
          cp *.conda /tmp/local-channel/noarch/
          # extract version from the package file name "quicknxs-<version>-<build>.conda"
          echo "PKG_VERSION=$(ls *.conda | cut -d'-' -f2)" >> $GITHUB_ENV

      # pkg-verify requires a conda env that already has the package
      # installed (and micromamba on PATH); pkg-install sets both up and
      # exposes the install directory for the Grype scan below.
      - name: Install built conda package
        id: install
        uses: neutrons/conda-actions/pkg-install@v2
        with:
          package-name: ${{ env.PKG_NAME }}
          local-channel: /tmp/local-channel
          python-version: "3.11"
          extra-channels: neutrons mantid oncat

      - name: Verify Conda Package
        uses: neutrons/conda-actions/pkg-verify@v2
        with:
          package-name: ${{ env.PKG_NAME }}
          conda-env-name: ${{ steps.install.outputs.conda_env }}
          extra-commands: |
            python -c "import mr_reduction"
            python -c "import mantid"

      # Audit the dependencies of the conda package we just installed. SARIF
      # results are uploaded to GitHub code scanning by the grype action.
      - name: Scan installed environment with Grype
        uses: neutrons/conda-actions/grype@v2
        with:
          path: ${{ steps.install.outputs.conda_install_dir }}

      - name: upload conda package as artifact
        uses: actions/upload-artifact@v7
        with:
          name: artifact-conda-package
          path: ${{ env.PKG_NAME }}-*.conda

  publish:
    runs-on: ubuntu-latest
    needs: [tests, build]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/next'
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.6

      - name: Download conda package artifact
        uses: actions/download-artifact@v8
        with:
          name: artifact-conda-package

      - name: Upload package to anaconda
        uses: neutrons/conda-actions/publish@v2
        with:
          anaconda-token: ${{ secrets.ANACONDA_TOKEN }}
          organization: neutrons
          package-path: ${{ env.PKG_NAME }}-*.conda

      - name: Remove old packages
        if: github.ref == 'refs/heads/next'
        uses: neutrons/conda-actions/pkg-remove@v2
        with:
          anaconda_token: ${{ secrets.ANACONDA_TOKEN }}
          organization: neutrons
          package_name: quicknxs
          label: ${{ env.CONDA_LABEL }}
          keep: 5

  # Trigger GitLab dev deploy pipeline
  deploy-dev:
    runs-on: ubuntu-latest
    needs: [tests, build]
    if: github.ref == 'refs/heads/next'
    steps:
      - name: Get Environment Name
        uses: neutrons/branch-mapper@main
        id: env_name
        with:
          prefix: quicknxs

      - name: Trigger Dev Deploy
        # use https://github.com/eic/trigger-gitlab-ci/pull/14 until merged
        uses: eic/trigger-gitlab-ci@d984d8d53d871d2fdc1325639d94322da6e8747f
        id: trigger
        with:
          url: https://code.ornl.gov
          project_id: 18088
          ref_name: main
          token: ${{ secrets.GITLAB_DEPLOY_TOKEN }}

      - name: Annotate commit
        uses: peter-evans/commit-comment@v4
        with:
          body: |
            GitLab pipeline for ${{ steps.env_name.outputs.name }} has been submitted for this commit: ${{ steps.trigger.outputs.web_url }}

########################
### Project Metadata ###
########################

[project]
name = "quicknxs"
description = "Magnetic Reflectivity Reduction"
dynamic = ["version"]
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
readme = "README.md"
keywords = ["neutrons", "quicknxs", "magnetic reflectivity"]

[project.urls]
homepage = "https://github.com/neutrons/quicknxs"
repository = "https://github.com/neutrons/quicknxs"
issues = "https://github.com/neutrons/quicknxs/issues"

[project.gui-scripts]
quicknxs-gui = "quicknxs.gui:main"

####################
### Build config ###
####################

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "versioningit"]

[tool.hatch.version]
source = "versioningit"

[tool.hatch.build]
artifacts = ["*.yml", "*.yaml", "*.ini", "*.gx", "*.json", "*.ui"]

[tool.hatch.build.hooks.versioningit-onbuild]
source-file = "src/quicknxs/_version.py"
build-file = "quicknxs/_version.py"
replacement = '"{next_version}"'

[tool.hatch.build.targets.wheel]
packages = ["src/quicknxs"]

[tool.versioningit.vcs]
method = "git"
default-tag = "4.0.0"

[tool.versioningit.next-version]
method = "minor"

[tool.versioningit.format]
distance = "{next_version}.dev{distance}"
dirty = "{version}+d{build_date:%Y%m%d}"
distance-dirty = "{next_version}.dev{distance}+d{build_date:%Y%m%d%H%M}"

[tool.versioningit.write]
file = "src/quicknxs/_version.py"

###################
### Pixi config ###
###################

[tool.pixi.workspace]
name = "quicknxs"
platforms = ["linux-64"]
channels = [
    "conda-forge",
    "neutrons",
    "oncat",
    "mantid-ornl",
    "mantid",
    "https://prefix.dev/pixi-build-backends",
]
# Required until the build feature becomes stable
preview = ["pixi-build"]

[tool.pixi.package]
name = "quicknxs"
version = "0.0.0"

[tool.pixi.package.build]
backend = { name = "pixi-build-python", version = "0.1.*" }

[tool.pixi.package.host-dependencies]
hatchling = "*"
versioningit = "*"

[tool.pixi.dependencies]
mr_reduction = "==2.5.0"

[tool.pixi.pypi-dependencies]
quicknxs = { path = ".", editable = true }

# Environments and features

[tool.pixi.environments]
default = { features = [
    "dev",
    "docs",
    "test",
    "build",
], solve-group = "default" }
docs = { features = ["dev", "docs"], no-default-feature = true }
build = { features = ["build"], no-default-feature = true }

[tool.pixi.feature.build.dependencies]
anaconda-client = "*"
check-wheel-contents = "*"
versioningit = "*"

[tool.pixi.feature.build.pypi-dependencies]
toml-cli = "*"

[tool.pixi.feature.dev.dependencies]
pip = "*"
pip-audit = "*"
pre-commit = "*"
ruff = "*"
versioningit = "*"

[tool.pixi.feature.docs.dependencies]
sphinx = "*"
sphinx_rtd_theme = "*"

[tool.pixi.feature.docs.pypi-dependencies]
sphinx-qt-documentation = "*"

[tool.pixi.feature.test.dependencies]
codecov = "*"
pytest = "*"
pytest-qt = "*"
pytest-cov = "*"
pytest-mock = "*"
pytest-xvfb = "*"

[tool.pixi.tasks]
# Documentation
build-docs = { cmd = 'sphinx-build -b html docs docs/_build/html', description = "Build documentation" }
test-docs = { cmd = "sphinx-build -M doctest docs docs/_build/html", description = "Test building the documentation" }
# Testing
test = { description = "Run the test suite", cmd = "pytest" }
# Packaging
conda-build-command = { cmd = "pixi build", description = "Wrapper for building the conda package - used by `conda-build`" }
conda-build = { description = "Build the conda package", depends-on = [
    "sync-version",
    "conda-build-command",
    "reset-version",
] }
conda-publish = { cmd = "anaconda upload *.conda", description = "Publish the .conda package to anaconda.org", depends-on = [
    "conda-build",
] }
# Misc
audit-deps = { cmd = "pip-audit --local -s osv", description = "Audit the package dependencies for vulnerabilities" }
clean = { cmd = 'rm -rf .pytest_cache .ruff_cache **/*.egg-info **/dist **/__pycache__ **/_version.py', description = "Clean up various caches and build artifacts" }
clean-conda = { cmd = "rm -f *.conda", description = "Clean the local .conda build artifacts" }
clean-docs = { cmd = "rm -rf docs/_build", description = "Clean up documentation build artifacts" }
clean-all = { description = "Clean all artifacts", depends-on = [
    "clean",
    "clean-conda",
    "clean-docs",
] }
sync-version = { cmd = 'version=$(python -m versioningit); toml set tool.pixi.package.version "$version" --toml-path pyproject.toml', description = "Sync pyproject.toml version with Git version" }
reset-version = { cmd = "toml set tool.pixi.package.version \"0.0.0\" --toml-path pyproject.toml", description = "Reset the package version to 0.0.0" }

##########################
### Pytest and CodeCov ###
##########################

[tool.coverage.run]
source = ["src/quicknxs"]
omit = ["test/*"]

[tool.pytest.ini_options]
pythonpath = [".", "src", "scripts"]
testpaths = ["test/"]
python_files = ["test*.py"]
norecursedirs = [
    ".git",
    "tmp*",
    "_tmp*",
    "__pycache__",
    "*dataset*",
    "*data_set*",
]
markers = ["datarepo: mark a test as using reflection_ui-data repository"]
qt_log_format = "{rec.when} {rec.type_name}: {rec.message}"

############
### Ruff ###
############

[tool.ruff]
line-length = 120
extend-exclude = ["notebooks/*", "icons/*", "test/notebooks/*"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "D",     # Docstrings
    "E",
    "F",
    "I",
    "N",
    "UP032", # Use f-strings instead of format call
    "W",
]
ignore = [
    "A001",   # Variable is shadowing a Python builtin
    "ARG001", # Unused function argument
    "ARG002", # Unused method argument
    "D100",   # Missing docstring in public module
    "D102",   # Missing docstring in public method
    "D103",   # Missing docstring in public function
    "D104",   # Missing docstring in public package
    "D105",   # Missing docstring in magic method
    "D202",   # No blank lines allowed after function docstring
    "D400",   # First line should end with a period
    "D401",   # First line should be in imperative mood
    "D404",   # Docstring stars with "this"
    "E402",   # Module level import not at top of file
    "E501",   # Line too long
    "E712",   # Avoid equality comparison to True
    "E721",   # Do not compare types, use 'isinstance()'
    "E722",   # Do not use bare 'except'
    "E741",   # Ambiguous variable name
    "F821",   # Undefined name
    "F841",   # Local variable 'x' is assigned to but never used
    "N802",   # Function name should be lowercase
    "N803",   # Argument name should be lowercase
    "N806",   # Variable in function should be lowercase
    "N815",   # Variable in class should not be mixedCase
    "N816",   # Variable in global scope should not be mixedCase
]

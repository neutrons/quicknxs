[project]
name = "quicknxs"
description = "Magnetic Reflectivity Reduction"
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = ["mr_reduction==2.2.0"]
license = { text = "Apache-2.0" }
keywords = ["neutrons", "quicknxs", "magnetic reflectivity"]
readme = "README.md"

[project.urls]
homepage = "https://github.com/neutrons/quicknxs"
repository = "https://github.com/neutrons/quicknxs"
issues = "https://github.com/neutrons/quicknxs/issues"

[project.gui-scripts]
quicknxs-gui = "quicknxs.gui:main"

[build-system]
requires = ["setuptools >= 47", "wheel", "toml", "versioningit"]
build-backend = "setuptools.build_meta"

[tool.versioningit.vcs]
method = "git"
default-tag = "4.0.0"

[tool.versioningit.next-version]
method = "minor"

[tool.versioningit.format]
distance = "{next_version}.dev{distance}"
dirty = "{version}+d{build_date:%Y%m%d}"
distance-dirty = "{next_version}.dev{distance}+d{build_date:%Y%m%d%H%M}"

[tool.versioningit.write]
file = "src/quicknxs/_version.py"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*", "scripts*", "docs*", "notebooks"]

[tool.setuptools.package-data]
"*" = ["*.yml", "*.yaml", "*.ini", "*.gx", "*.json", "*.ui"]

[tool.coverage.run]
source = ["src/quicknxs"]
omit = ["test/*"]

[tool.pytest.ini_options]
pythonpath = [".", "src", "scripts"]
testpaths = ["test/"]
python_files = ["test*.py"]
norecursedirs = [
    ".git",
    "tmp*",
    "_tmp*",
    "__pycache__",
    "*dataset*",
    "*data_set*",
]
markers = ["datarepo: mark a test as using reflection_ui-data repository"]
qt_log_format = "{rec.when} {rec.type_name}: {rec.message}"

[tool.ruff]
line-length = 120
exclude = ["notebooks/*", "icons/*", "test/notebooks/*"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "D",     # Docstrings
    "E",
    "F",
    "I",
    "N",
    "UP032", # Use f-strings instead of format call
    "W",
]
ignore = [
    "A001",   # Variable is shadowing a Python builtin
    "ARG001", # Unused function argument
    "ARG002", # Unused method argument
    "D100",   # Missing docstring in public module
    "D102",   # Missing docstring in public method
    "D104",   # Missing docstring in public package
    "D105",   # Missing docstring in magic method
    "D400",   # First line should end with a period
    "D401",   # First line should be in imperative mood
    "D404",   # Docstring stars with "this"
    "E402",   # Module level import not at top of file
    "E501",   # Line too long
    "E712",   # Avoid equality comparison to True
    "E721",   # Do not compare types, use 'isinstance()'
    "E722",   # Do not use bare 'except'
    "E741",   # Ambiguous variable name
    "F821",   # Undefined name
    "F841",   # Local variable 'x' is assigned to but never used
    "N802",   # Function name should be lowercase
    "N803",   # Argument name should be lowercase
    "N806",   # Variable in function should be lowercase
    "N815",   # Variable in class should not be mixedCase
    "N816",   # Variable in global scope should not be mixedCase
]
